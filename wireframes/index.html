<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXXUS LAB - Wireframes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --bg: #0a0a0a;
      --surface: #1a1a1a;
      --surface-2: #2a2a2a;
      --border: #333;
      --text: #fff;
      --text-secondary: #888;
      --accent: #00d4ff;
      --placeholder: #444;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    
    /* Toolbar */
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    
    .toolbar-title {
      font-weight: 600;
      font-size: 14px;
      color: var(--accent);
    }
    
    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .device-toggle {
      display: flex;
      background: var(--surface-2);
      border-radius: 8px;
      padding: 4px;
    }
    
    .device-toggle button {
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    
    .device-toggle button.active {
      background: var(--accent);
      color: #000;
    }
    
    .page-select {
      padding: 8px 16px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }
    
    /* Canvas */
    .canvas {
      padding-top: 80px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding-bottom: 48px;
    }
    
    .frame {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: width 0.3s ease;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    
    .frame.desktop {
      width: 1200px;
    }
    
    .frame.mobile {
      width: 375px;
    }
    
    /* Wireframe Styles */
    .wf-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    
    .wf-logo {
      width: 100px;
      height: 24px;
      background: linear-gradient(90deg, var(--accent), #0066ff);
      border-radius: 4px;
    }
    
    .wf-nav-links {
      display: flex;
      gap: 24px;
    }
    
    .wf-nav-link {
      width: 60px;
      height: 12px;
      background: var(--placeholder);
      border-radius: 2px;
    }
    
    .wf-nav-cta {
      width: 100px;
      height: 36px;
      background: linear-gradient(90deg, var(--accent), #0066ff);
      border-radius: 20px;
    }
    
    .wf-hamburger {
      display: none;
      width: 24px;
      height: 18px;
      flex-direction: column;
      justify-content: space-between;
    }
    
    .wf-hamburger span {
      height: 2px;
      background: var(--text-secondary);
      border-radius: 1px;
    }
    
    /* Hero */
    .wf-hero {
      min-height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 24px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }
    
    .wf-hero::before {
      content: '';
      position: absolute;
      top: 20%;
      left: 20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0,212,255,0.1) 0%, transparent 70%);
      border-radius: 50%;
    }
    
    .wf-hero::after {
      content: '';
      position: absolute;
      bottom: 20%;
      right: 20%;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(0,102,255,0.1) 0%, transparent 70%);
      border-radius: 50%;
    }
    
    .wf-badge {
      padding: 8px 16px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .wf-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }
    
    .wf-headline {
      position: relative;
      z-index: 1;
      margin-bottom: 24px;
    }
    
    .wf-headline-lg {
      height: 48px;
      width: 400px;
      max-width: 100%;
      background: linear-gradient(90deg, var(--accent), #0066ff, #8800ff);
      border-radius: 8px;
      margin-bottom: 12px;
    }
    
    .wf-headline-sm {
      height: 48px;
      width: 200px;
      background: var(--text);
      border-radius: 8px;
    }
    
    .wf-description {
      height: 16px;
      width: 500px;
      max-width: 100%;
      background: var(--placeholder);
      border-radius: 4px;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }
    
    .wf-cta-group {
      display: flex;
      gap: 16px;
      margin-top: 32px;
      position: relative;
      z-index: 1;
    }
    
    .wf-btn-primary {
      padding: 16px 32px;
      background: linear-gradient(90deg, var(--accent), #0066ff);
      border-radius: 30px;
      font-size: 14px;
      color: #000;
      font-weight: 600;
    }
    
    .wf-btn-secondary {
      padding: 16px 32px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 30px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    
    .wf-trust {
      margin-top: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 1;
    }
    
    .wf-trust-label {
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .wf-trust-logos {
      display: flex;
      gap: 32px;
      opacity: 0.5;
    }
    
    .wf-trust-logo {
      width: 80px;
      height: 12px;
      background: var(--placeholder);
      border-radius: 2px;
    }
    
    /* Section */
    .wf-section {
      padding: 64px 24px;
    }
    
    .wf-section.dark {
      background: var(--bg);
    }
    
    .wf-section-header {
      text-align: center;
      margin-bottom: 48px;
    }
    
    .wf-section-title {
      height: 32px;
      width: 250px;
      background: var(--text);
      border-radius: 6px;
      margin: 0 auto 16px;
    }
    
    .wf-section-subtitle {
      height: 14px;
      width: 350px;
      max-width: 100%;
      background: var(--placeholder);
      border-radius: 4px;
      margin: 0 auto;
    }
    
    /* Grid */
    .wf-grid {
      display: grid;
      gap: 24px;
    }
    
    .wf-grid.cols-2 {
      grid-template-columns: repeat(2, 1fr);
    }
    
    .wf-grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }
    
    .wf-grid.cols-4 {
      grid-template-columns: repeat(4, 1fr);
    }
    
    /* Cards */
    .wf-card {
      padding: 24px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    
    .wf-card-icon {
      width: 48px;
      height: 48px;
      background: var(--placeholder);
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    
    .wf-card-title {
      height: 20px;
      width: 150px;
      background: var(--text);
      border-radius: 4px;
      margin-bottom: 12px;
    }
    
    .wf-card-desc {
      height: 12px;
      background: var(--placeholder);
      border-radius: 2px;
      margin-bottom: 8px;
    }
    
    .wf-card-desc:last-child {
      width: 80%;
    }
    
    /* Pricing Card */
    .wf-pricing-card {
      padding: 32px 24px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      position: relative;
    }
    
    .wf-pricing-card.highlighted {
      border-color: var(--accent);
      box-shadow: 0 0 40px rgba(0,212,255,0.1);
    }
    
    .wf-pricing-badge {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 16px;
      background: linear-gradient(90deg, var(--accent), #0066ff);
      border-radius: 20px;
      font-size: 10px;
      color: #000;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .wf-pricing-name {
      height: 18px;
      width: 80px;
      background: var(--text-secondary);
      border-radius: 4px;
      margin-bottom: 16px;
    }
    
    .wf-pricing-price {
      height: 32px;
      width: 120px;
      background: var(--text);
      border-radius: 6px;
      margin-bottom: 16px;
    }
    
    .wf-pricing-desc {
      height: 12px;
      background: var(--placeholder);
      border-radius: 2px;
      margin-bottom: 24px;
    }
    
    .wf-pricing-features {
      margin-bottom: 24px;
    }
    
    .wf-pricing-feature {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    
    .wf-pricing-check {
      width: 16px;
      height: 16px;
      background: var(--accent);
      border-radius: 50%;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
    }
    
    .wf-pricing-feature-text {
      height: 12px;
      flex: 1;
      background: var(--placeholder);
      border-radius: 2px;
    }
    
    .wf-pricing-cta {
      width: 100%;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }
    
    .wf-pricing-card.highlighted .wf-pricing-cta {
      background: linear-gradient(90deg, var(--accent), #0066ff);
      border: none;
    }
    
    /* Workflow Step */
    .wf-step {
      padding: 24px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      position: relative;
      text-align: center;
    }
    
    .wf-step-number {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), #0066ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: #000;
    }
    
    .wf-step-title {
      height: 18px;
      width: 100px;
      background: var(--text);
      border-radius: 4px;
      margin: 16px auto 12px;
    }
    
    .wf-step-desc {
      height: 10px;
      background: var(--placeholder);
      border-radius: 2px;
      margin-bottom: 6px;
    }
    
    /* Client Card */
    .wf-client-card {
      padding: 24px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    
    .wf-client-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    
    .wf-client-logo {
      width: 48px;
      height: 48px;
      background: var(--placeholder);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    
    .wf-client-info {
      flex: 1;
    }
    
    .wf-client-name {
      height: 16px;
      width: 100px;
      background: var(--text);
      border-radius: 4px;
      margin-bottom: 6px;
    }
    
    .wf-client-industry {
      height: 10px;
      width: 70px;
      background: var(--placeholder);
      border-radius: 2px;
    }
    
    .wf-client-desc {
      height: 10px;
      background: var(--placeholder);
      border-radius: 2px;
      margin-bottom: 6px;
    }
    
    .wf-client-testimonial {
      margin-top: 16px;
      padding: 12px;
      background: var(--surface);
      border-radius: 8px;
    }
    
    .wf-client-quote {
      height: 10px;
      background: var(--placeholder);
      border-radius: 2px;
      margin-bottom: 6px;
    }
    
    .wf-client-author {
      height: 8px;
      width: 80px;
      background: var(--text-secondary);
      border-radius: 2px;
      margin-top: 12px;
    }
    
    /* Team Card */
    .wf-team-card {
      padding: 24px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-align: center;
    }
    
    .wf-team-avatar {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(136,0,255,0.2));
      border: 2px solid var(--border);
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    
    .wf-team-name {
      height: 18px;
      width: 120px;
      background: var(--text);
      border-radius: 4px;
      margin: 0 auto 8px;
    }
    
    .wf-team-role {
      height: 12px;
      width: 80px;
      background: var(--accent);
      border-radius: 4px;
      margin: 0 auto 16px;
    }
    
    .wf-team-bio {
      height: 10px;
      background: var(--placeholder);
      border-radius: 2px;
      margin-bottom: 6px;
    }
    
    .wf-team-socials {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }
    
    .wf-team-social {
      width: 32px;
      height: 32px;
      background: var(--surface);
      border-radius: 8px;
    }
    
    /* FAQ */
    .wf-faq {
      max-width: 700px;
      margin: 0 auto;
    }
    
    .wf-faq-item {
      padding: 24px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 16px;
    }
    
    .wf-faq-question {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    
    .wf-faq-number {
      color: var(--accent);
      font-size: 12px;
      font-family: monospace;
    }
    
    .wf-faq-q-text {
      height: 16px;
      flex: 1;
      background: var(--text);
      border-radius: 4px;
    }
    
    .wf-faq-answer {
      padding-left: 40px;
    }
    
    .wf-faq-a-text {
      height: 10px;
      background: var(--placeholder);
      border-radius: 2px;
      margin-bottom: 6px;
    }
    
    /* Contact Form */
    .wf-contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
    }
    
    .wf-form {
      padding: 32px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    
    .wf-form-title {
      height: 24px;
      width: 180px;
      background: var(--text);
      border-radius: 4px;
      margin-bottom: 24px;
    }
    
    .wf-input {
      width: 100%;
      height: 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      padding: 0 16px;
      display: flex;
      align-items: center;
    }
    
    .wf-input-label {
      height: 12px;
      width: 100px;
      background: var(--placeholder);
      border-radius: 2px;
    }
    
    .wf-textarea {
      width: 100%;
      height: 120px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      padding: 16px;
    }
    
    .wf-submit {
      width: 100%;
      height: 52px;
      background: linear-gradient(90deg, var(--accent), #0066ff);
      border-radius: 12px;
    }
    
    .wf-contact-info {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .wf-contact-info-title {
      height: 24px;
      width: 200px;
      background: var(--text);
      border-radius: 4px;
      margin-bottom: 8px;
    }
    
    .wf-contact-info-desc {
      height: 12px;
      width: 250px;
      background: var(--placeholder);
      border-radius: 2px;
      margin-bottom: 24px;
    }
    
    .wf-contact-card {
      padding: 24px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    
    .wf-contact-icon {
      width: 48px;
      height: 48px;
      background: rgba(0,212,255,0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    
    .wf-contact-card-title {
      height: 14px;
      width: 100px;
      background: var(--text);
      border-radius: 2px;
      margin-bottom: 8px;
    }
    
    .wf-contact-card-value {
      height: 12px;
      width: 150px;
      background: var(--placeholder);
      border-radius: 2px;
    }
    
    .wf-map {
      height: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }
    
    .wf-map-icon {
      font-size: 32px;
      opacity: 0.5;
    }
    
    .wf-map-text {
      height: 12px;
      width: 120px;
      background: var(--placeholder);
      border-radius: 2px;
    }
    
    /* CTA Section */
    .wf-cta-section {
      padding: 64px 24px;
    }
    
    .wf-cta-box {
      padding: 64px 48px;
      background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(0,102,255,0.1), rgba(136,0,255,0.1));
      border: 1px solid var(--border);
      border-radius: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .wf-cta-title {
      height: 32px;
      width: 350px;
      max-width: 100%;
      background: var(--text);
      border-radius: 6px;
      margin: 0 auto 16px;
    }
    
    .wf-cta-desc {
      height: 14px;
      width: 450px;
      max-width: 100%;
      background: var(--placeholder);
      border-radius: 4px;
      margin: 0 auto 32px;
    }
    
    /* Newsletter */
    .wf-newsletter {
      max-width: 500px;
      margin: 0 auto;
      padding: 32px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    
    .wf-newsletter-form {
      display: flex;
      gap: 12px;
    }
    
    .wf-newsletter-input {
      flex: 1;
      height: 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    
    .wf-newsletter-btn {
      padding: 0 24px;
      background: linear-gradient(90deg, var(--accent), #0066ff);
      border-radius: 12px;
      height: 48px;
    }
    
    .wf-newsletter-note {
      height: 10px;
      width: 200px;
      background: var(--placeholder);
      border-radius: 2px;
      margin: 16px auto 0;
    }
    
    /* Chat */
    .wf-chat-section {
      padding: 48px 24px;
      background: var(--surface);
      text-align: center;
    }
    
    .wf-chat-title {
      height: 24px;
      width: 300px;
      background: var(--text);
      border-radius: 4px;
      margin: 0 auto 12px;
    }
    
    .wf-chat-desc {
      height: 12px;
      width: 400px;
      max-width: 100%;
      background: var(--placeholder);
      border-radius: 2px;
      margin: 0 auto 24px;
    }
    
    .wf-chat-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    
    .wf-chat-dot {
      width: 10px;
      height: 10px;
      background: #00ff88;
      border-radius: 50%;
    }
    
    .wf-chat-text {
      height: 14px;
      width: 140px;
      background: var(--text);
      border-radius: 2px;
    }
    
    /* Footer */
    .wf-footer {
      padding: 48px 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    
    .wf-footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 48px;
      margin-bottom: 48px;
    }
    
    .wf-footer-brand {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .wf-footer-logo {
      width: 120px;
      height: 28px;
      background: linear-gradient(90deg, var(--accent), #0066ff);
      border-radius: 4px;
    }
    
    .wf-footer-desc {
      height: 10px;
      background: var(--placeholder);

            </div>
            <div>
              <div class="wf-footer-col-title"></div>
              <div class="wf-footer-link"></div>
              <div class="wf-footer-link"></div>
            </div>
          </div>
          <div class="wf-footer-bottom">
            <div class="wf-footer-copyright"></div>
            <div class="wf-footer-location"></div>
          </div>
        </footer>
      `
    };

    // Initialize
    const frame = document.getElementById('frame');
    const pageSelect = document.getElementById('pageSelect');
    const deviceButtons = document.querySelectorAll('.device-toggle button');
    
    let currentDevice = 'desktop';
    let currentPage = 'home';
    
    function render() {
      frame.innerHTML = pages[currentPage];
      frame.className = 'frame ' + currentDevice;
    }
    
    pageSelect.addEventListener('change', (e) => {
      currentPage = e.target.value;
      render();
    });
    
    deviceButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        deviceButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentDevice = btn.dataset.device;
        render();
      });
    });
    
    // Initial render
    render();
  </script>
</body>
</html>
